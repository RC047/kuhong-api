<html>
<body>
   <a id="batteryLevel"></a>
   <a id="batteryCharging"></a>
   <a id="chargingTime"></a>
   <a id="dischargingTime"></a>
<script>
var Battery = (function(self) {                                                                                                                               var _events = 'chargingchange chargingtimechange dischargingtimechange levelchange'
    , _battery = navigator.getBattery || navigator.battery || navigator.mozBattery                                                                              , _status = null                                                              , _statusCallback = function() {}
    , _updateCallback = function() {}                                             , STATUS_UNSUPPORTED = 'Not supported';                                                                                                                   self.getStatus = function(fn) {
    if(_status === STATUS_UNSUPPORTED) {                                            fn(null, _status);                                                          } else if(_status) {                                                            fn(_status);
    } else {                                                                        _statusCallback = fn;                                                       }                                                                           };

  self.onUpdate = function(fn) {
    _updateCallback = fn;
  };

  function eventHandler(status) {
    _status = status;
    _updateCallback(_status);
  }

  function registerEventHandler(battery) {
    _events.split(' ').forEach(function(evt) {
      battery.addEventListener(evt, eventHandler);
    });
  }

  if(_battery instanceof Function) {
    _battery.call(navigator)
      .then(function(status) {
        _status = status;
        _statusCallback(_status);
        registerEventHandler(_status);
      }, function() {
        _status = STATUS_UNSUPPORTED;
      });
  } else if(_battery) {
    _status = _battery;
    registerEventHandler(_battery);
  } else {
    _status = STATUS_UNSUPPORTED;
  }

  return self;
})(Battery || {});

Battery.getStatus(function(status, error) {

var batteryLevel = `Battery: ${Math.floor(status.level * 100)}%`;
var batteryCharging = `Charging: ${status.charging}`;
var chargingTime = `Charging Time: ${status.chargingTime}`;
var dischargingTime = `Discharging Time: ${status.dischargingTime}`;


document.getElementById("batteryLevel").innerHTML = batteryLevel;
document.getElementById("batteryCharging").innerHTML = batteryCharging;
document.getElementById("chargingTime").innerHTML = chargingTime;
document.getElementById("dischargingTime").innerHTML = dischargingTime;
});
</script>
</body>
</html>
