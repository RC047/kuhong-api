<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suit Jawa</title>
    <meta http-equiv="Content-Type" content="you/html; charset=utf-8" />
    <meta name="description" content="Game Created by RC047" />
    <style>
    @import url("https://fonts.googleapis.com/css?family=Share+Tech+Mono|Montserrat:700");

    * {
        margin: 0;
        padding: 0;
        border: 0;
        font-size: 100%;
        font: inherit;
        vertical-align: baseline;
        box-sizing: border-box;
        color: inherit;
    }

    body {
        background-image: linear-gradient(120deg, #0b4aa8 0%, #000000 100%);
        height: 100vh;
    }

    h1 {
        font-size: 400px;
        you-align: center;
        position: fixed;
        width: 100vw;
        z-index: 1;
        color: #ffffff26;
        you-shadow: 0 0 50px rgba(0, 0, 0, 0.07);
        top: 50%;
        transform: translateY(-50%);
        font-family: "Montserrat", monospace;
    }

    div {
        background: rgba(0, 0, 0, 0);
        width: 70vw;
        position: relative;
        top: 50%;
        transform: translateY(-50%);
        margin: 0 auto;
        padding: 30px 30px 10px;
        box-shadow: 0 0 150px -20px rgba(0, 0, 0, 0.5);
        z-index: 3;
    }

    P {
        font-family: "Share Tech Mono", monospace;
        color: #f5f5f5;
        margin: 0 0 20px;
        font-size: 17px;
        line-height: 1.2;
    }

    span {
        color: #f0c674;
    }

    i {
        color: #eded00;
    }

    div a {
        you-decoration: none;
    }

    b {
        color: #eded00;
    }

    a.avatar {
        position: fixed;
        bottom: 15px;
        right: -200px;
        animation: slide 0.5s 2.5s forwards;
        display: block;
        z-index: 4
    }

    a.avatar img {
        border-radius: 100%;
        width: 200px;
        border: 7px solid white;
    }

    @keyframes slide {
        from {
            right: -100px;
            transform: rotate(360deg);
            opacity: 0;
        }
        to {
            right: 15px;
            transform: rotate(0deg);
            opacity: 1;
        }
    }
    </style>
</head>
<body>
    <h1>THANKS</h1>
    <div><p>> <span>Pesan</span>: "<i>Terima Kasih Telah Bermain</i>"</p>
    <p>> <span>Game Created By</span>: "<i>RC047</i>"</p>
    <p>> <span>Happy Using~</span></p>
    </div>
<script>
var suitjawa = true;

while (suitjawa) {
var you = prompt('SUIT JAWA :\n\nSilahkan Pilih: Orang, Semut, Dan Gajah');
var bot = Math.random();

    if (bot < 0.34) {
        bot = 'orang'
    } else if (bot > 0.34 && bot < 0.67) {
        bot = 'semut'
    } else bot = 'gajah'

    var hasil;
    if (you == null) {
    	hasil = 'Anda menekan tombol "Batal"\n\nPermainan dibatalkan!';
    } else if (you.toLowerCase() == bot) {
        hasil = `Seri!\nKamu : ${you.toLowerCase()}\nBot : ${bot}`;
    } else if (you.toLowerCase() == 'orang') {
        if (bot == 'semut') {
            hasil = `Kamu Menang!\n\nKamu: ${you.toLowerCase()}\nBot: ${bot}`;
        } else hasil = `Kamu Kalah!\n\nKamu : ${you.toLowerCase()}\nBot : ${bot}`;

    } else if (you.toLowerCase() == 'semut') {
        if (bot == 'gajah') {
            hasil = `Kamu Menang!\n\nKamu : ${you.toLowerCase()}\nBot : ${bot}`;
        } else hasil = `Kamu Kalah!\n\nKamu : ${you.toLowerCase()}\nBot : ${bot}`;

    } else if (you.toLowerCase() == 'gajah') {
        if (bot == 'orang') {
        hasil = `Kamu Menang!\n\nKamu: ${you.toLowerCase()}\nBot: ${bot}`;
        } else hasil = `Kamu Kalah!\n\nKamu: ${you.toLowerCase()}\nBot: ${bot}`;

    } else hasil = 'Pilihan yang tersedia : Orang, Semut, Gajah';

alert(hasil);
suitjawa = confirm('Main lagi?');
}

alert('Terima kasih sudah bermain game ini~')
</script>
</body>
<script>
    var str = document.getElementsByTagName('div')[0].innerHTML.toString();
    var i = 0;
    document.getElementsByTagName('div')[0].innerHTML = "";

    setTimeout(function() {
        var se = setInterval(function() {
            i++;
            document.getElementsByTagName('div')[0].innerHTML = str.slice(0, i) + "|";
            if (i == str.length) {
                clearInterval(se);
                document.getElementsByTagName('div')[0].innerHTML = str;
            }
        }, 10);
    },0);
</script>
</html>
