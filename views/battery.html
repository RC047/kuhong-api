<pre id="result"></pre>
<script>
var battery = (function(self) {
  var _events = 'chargingchange chargingtimechange dischargingtimechange levelchange'
    , _battery = navigator.getBattery || navigator.battery || navigator.mozBattery
    , _status = null
    , _statusCallback = function() {}
    , _updateCallback = function() {}
    , STATUS_UNSUPPORTED = 'Not Supported';

  /** Function: getStatus
   * Register callback function to retrieve status
   *
   * Parameters:
   * (Function) fn(status, error) - callback function
   */
  self.getStatus = function(fn) {
    if(_status === STATUS_UNSUPPORTED) {
      fn(null, _status);
    } else if(_status) {
      fn(_status);
    } else {
      _statusCallback = fn;
    }
  };

  /* Function: onUpdate
   * Register callback function when battery status changes
   *
   * Parameters:
   * (Function) fn(status) - callback function
   */
  self.onUpdate = function(fn) {
    _updateCallback = fn;
  };

  function eventHandler(status) {
    _status = status;
    _updateCallback(_status);
  }

  function registerEventHandler(battery) {
    _events.split(' ').forEach(function(evt) {
      battery.addEventListener(evt, eventHandler);
    });
  }

  if(_battery instanceof Function) {
    _battery.call(navigator)
      .then(function(status) {
        _status = status;
        _statusCallback(_status);
        registerEventHandler(_status);
      }, function() {
        _status = STATUS_UNSUPPORTED;
      });
  } else if(_battery) {
    _status = _battery;
    registerEventHandler(_battery);
  } else {
    _status = STATUS_UNSUPPORTED;
  }

  return self;
})(battery || {});

battery.getStatus(function(status, error) {

var creator = pickRandom(['Rendy', 'RC047', 'RendyCraft047', 'RendyGans', 'RendyGamteng', 'Kang Rendy'])
var level = Math.floor(status.level * 100) + '%';
var charging = status.charging;
var discharging = null;
if (status.charging == false) discharging = true;
if (status.charging == true) discharging = false;
var chargingTime = status.chargingTime;
var dischargingTime = status.dischargingTime;
if (error) {
	document.getElementById("result").innerHTML = `{<br>   "error": "Battery is not supported!"<br>}`;
	throw false;
}

var result = `{<br>   "status": true,<br>   "creator": "${creator}",<br>   "batteryLevel": "${level}",<br>   "statusCharging": ${charging},<br>   "statusDischarging": ${discharging},<br>   "chargingTime": "${chargingTime}",<br>   "dischargingTime": "${dischargingTime}"<br>}`;
document.getElementById("result").innerHTML = result;
})

function pickRandom(list) {
	return list[Math.floor(Math.random() * list.length)];
}
</script>
