<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bot Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimal-ui">
    <meta name="description" content="Tempatnya chatting bersama Bot dengan orang gabut">
    <script src="js/ads.js"></script>
    <style>
#chat {
  width: 295px;
  height: fixed;
  border-color: #000;
  border-style: solid;
  border-radius: 5px;
  padding: 3px;
  margin : 1px;
  overflow: auto;
  overflow-x: auto;
  overflow-y: auto;
  font-size: 13px;
}

.chat {
  text-align: left;
  width: 275px;
  height: fixed;
  background-color: #fff;
  border-radius: 5px;
}
    </style>
</head>
<body onload="getNotifications();">
    <marquee id="notification"></marquee>
        <p id="chat"><a id="no-message"></a></p><br>
        <input type="text" style="width:252px; height:30px" id="message" placeholder="Ketik pesan">
        <input type="submit" style="height:30px" value="Kirim" onclick="sendMessage();">
        <input type="submit" value="Ganti Nama" onclick="changeName();">
        <input type="submit" value="Clear Chat" onclick="clearChat();">
        <input type="submit" value="History" onclick="getHistoryMessages();"><br><br>
        <div>Mode Chat :
        <input type="radio" name="selection" value="private" onclick="setPublic(false);" CHECKED>Private
        <input type="radio" name="selection" value="public" onclick="setPublic(true);">Public<br>
        <input type="hidden" name="selection-remove" value="remove"><br>
        </div>
    <br><br>
<script src="js/botchat.js"></script>
<script src="js/battery.js"></script>
</body>
</html>
