<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
    <title>Bot Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimal-ui">
    <meta name="description" content="Obrolan Dengan Bot Gratis!">
    <style>
#chat {
  width: 295px;
  height: fixed;
  border-color: #000;
  border-style: solid;
  border-radius: 5px;
  padding: 3px;
  margin : 1px;
  overflow: auto;
  overflow-x: auto;
  overflow-y: auto;
  font-size: 13px;
  }

.chat {
  text-align: left;
  width: 275px;
  height: fixed;
  background-color: #fff;
  border-radius: 5px;
}

#message {
  width: 252px;
  height: 30px;
}

#send {
  height: 30px;
}
    </style>
</head>
<body onload="getNotifications();">
    	<marquee id="notification"></marquee>
        <p id="chat"><a id="no-message"></a></p><br>
        <input type="text" id="message" placeholder="Ketik pesan">
        <input type="submit" id="send" value="Kirim" onclick="sendMessage();">
        <input type="submit" value="Ganti Nama" onclick="changeName();">
        <input type="submit" value="Bersihkan Chat" onclick="clearChat();"><br><br>
        <div>Mode Chat :<input type="radio" name="selection" value="private" onclick="setPublic(false);" CHECKED>Private<input type="radio" name="selection" value="public" onclick="setPublic(true);">Public<br>
        <input type="hidden" name="selection-remove" value="remove"><br>
        </div>
    <br><br>
<script>
var newLine = unescape('%3Cbr%3E');
var publicChat = false;
var nama = 'Guest' + Math.floor(Math.random() * 10000);
document.getElementById("no-message").innerHTML = newLine + getDate() + tilt('Tidak ada pesan.');

function tilt(text) {
   return unescape('%3Cvar%3E') + text + unescape('%3C/var%3E');
}

function bold(text) {
   return unescape('%3Cstrong%3E') + text + unescape('%3C/strong%3E');
}

function getNotifications() {
var isOnline = pickRandom(['Bot sedang online.', Math.floor(Math.random() * 20) + ' orang sedang online.']);
	return document.getElementById("notification").innerHTML = pickRandom([isOnline, 'Selamat bersenang2 :)', 'Mohon jangan untuk spam!', 'Jika Bot tidak membalas segera hubungi Owner okeh!', 'Ini hanya untuk bersenang-senang ok!', 'Mohon jangan saling membully', 'Dilarang untuk Toxic!']);
}

function getDate() {
var date = new Date();
   return '[' + date.getHours() + ':' + date.getMinutes() + ':' + date.getSeconds() + '] ';
}

function changeName() {
nama = prompt('Silahkan ganti namamu :').split(':')[0];
if (nama == null || nama == '') {
    nama = 'Guest' + Math.floor(Math.random() * 10000);
    throw false;
    } else if (nama.startsWith('Kuhong') || nama.startsWith('kuhong') || nama.startsWith('RC047')) {
    alert('Nama yang anda masukan sudah diambil!');
    throw false;
    } else if (nama.endsWith(')') || nama.endsWith('✓')) {
    alert('Nama anda tidak diizinkan!');
    nama = 'Guest' + Math.floor(Math.random() * 10000);
    throw false;
    }
alert('Berhasil mengganti nama menjadi ' + nama.split(':')[0]);
}

function getRandomName() {
var guestName = 'Guest' + Math.floor(Math.random() * 10000) + ': ';
var ranName = pickRandom(['RC047 (✓): ', 'Saya: ', 'Bukan Saya: ', 'Bukan Bot: ', 'Helin: ', 'Arnold: ', 'Master: ', 'Chef: ', 'Orang: ', 'Mikey: ', 'Agil: ', 'Awoakakak: ', 'Helmi: ', 'Dika: ', 'Suster: ', 'Anak: ', 'Ridwan: ', 'Razz: ', 'P cari doi: ', 'Hmm: ', 'Si Manis: ', 'Kacung: ', 'sygg: ', '86: ', 'Pajar: ', 'Ardian: ', 'Septian: ', 'Jungkook: ', 'Ryan: ', 'alboOwkdiw: ', 'Y: ', 'Reza: ', 'Kang copas: ', 'Tukang Seblak: ', 'Pikri: ', 'Manusia: ', 'Wibu-Lovers: ', 'FF Burik: ', 'Ardjoena: ', 'Selfia: ', 'Kenzo: ', 'Rafli: ', 'Dean: ', 'Felita: ', 'Wili: ', 'Putra: ', 'F: ', 'Gamers: ', 'Ipin: ', 'Botak: ', 'Hehe: ']);
   return pickRandom([guestName, ranName]);
}

function getRandomMessage(name) {
   return pickRandom([Math.floor(Math.random() * 100), 'Gak nyambung', 'Itu', 'Itu lu kali', 'Mungkin lu yg gtu', 'Jadi gini...', 'Jadi?', 'Give diamond woee', 'Anjay', 'Apa', 'Ihhhh', 'Paan', 'Apaansii', 'Ishhh', 'Mmm', '...', 'Z', 'Dibersihin_-', 'First', 'Bodoh', 'Siapa?', 'Lu?', 'Yahaha', 'Mari kita tebak angka kawan', 'Salah!', 'Lah trus apa?', 'Anj', 'Dhlah', 'Ok', 'Bot mana bot', 'Keren sih parah', 'Nahh dia bener!', 'IRI BILANG BOS', 'Bener?', 'Pacaran yuk', '-_-', 'Sepi kaleee', 'Njirr', 'Bjir', 'Itu bukan?', 'itu?', 'ini bukan?', 'ini?', 'Wahh', 'Pfft', 'P', 'P nyari doi super', 'P cari doi', 'P cari apikey gratis', 'Coba tanya ' + bold('@' + name.split(':')[0]) + ' aja', 'Selamat!', 'Bener tuh', 'Benar!', 'Bener?', 'Hehee', 'Iya maaf', 'Maaf', 'Mabar?', 'Kuy mabar', 'Mabar yokk', 'Bjirr', 'Tumben rame', 'Kalah ama ' + bold('@' + name.split(':')[0]), ' :v', ':v', 'Bang', 'Bang', 'Sat', 'Sat', 'Kuy', 'Yok', 'Hemm', 'Lu siapa?', 'Coba', bold('@' + nama), 'Diem aja', 'B aja', 'Woy', 'Ngopi bang?', 'F', 'Iya', 'Iy', 'Oke', 'Ok', 'G', 'Gk', 'Gak', 'Woee', 'Ajglh', 'Dicuekin lagi', 'Punten Gopud', 'Eeehh', 'Kasar bodo', 'Cuy', 'Bacot', 'Nyimak', 'Nyimak ajalh', 'Ayo', '?', '???', '!', '.', ':v', 'v:', ':V', ';v', 'Keren', 'Mari mengaduk kawan', 'Bye one?', 'Cuk', 'Sepi', 'Sepi kali', '1+1=11', 'GG', 'Anjirr', 'Parahh', 'Gileee', 'Dicuekin', 'Awoakakak', 'Gip alok', 'Knp?', 'Males', 'Enak cuk', 'Wkwwkwkwkwk', 'Bengek', 'Tes', 'Siap', 'Lahh', 'Gmn', 'Stop', 'Jan spam', 'asw', 'Asw', 'Asuu', 'Copy dulu bru paste', 'Percuma bnyk fiturnya klo pd mati', ':)', "'-'", ':(', ':/', ':b', 'Bgi no wa', 'Yahh', 'Pliss', 'Heyy', '!!!', 'Sfx', 'WOIIIIII', 'Tayo', 'Gak lucu', 'Bot', '!help', 'Mana', 'Gak bisa', 'Lol', 'Bruhh', 'Bruhh', 'What', 'Ohh', 'O', 'Stress', 'Lu knp?', 'Mewhwhwwhee', 'Ketawa?', 'Kgk', 'Yoii', 'Skuyy', 'Bangg', 'Tante', 'Baik', 'Apa kabar', 'Kok gk bisa sihh', 'Iya iya', '-_-', '_-', '-_', 'P', 'Ppppppppppp', 'Jangan kasar!', 'Makan bang', 'Ngeteh bang', 'LOL', 'P cari guild', 'Bantu share', 'Up']);
}

function sendMessage() {
var pesan = document.getElementById("message").value;
if (pesan == '') throw false;
if (pesan.length > 500) return alert('Pesan terlalu panjang!');
var styledName = unescape('%3Ca%20style=%22color:red%22%3E') + nama + ': ' + unescape('%3C/a%3E');
var send = newLine + getDate() + styledName + pesan.replace(/_/g, unescape('%3Cvar%3E')).replace('*', unescape('%3Cstrong%3E')).replace('*', unescape('%3Cstrong%3E'));
document.getElementById("no-message").innerHTML = '';
document.getElementById("chat").innerHTML += send;
setTimeout(() => getBotMessage(pesan), 1000);
document.getElementById("message").value = '';
}

function getApikey() {
var xhr = new XMLHttpRequest();
var url = 'https://kuhong-api.herokuapp.com/api/getapikey';
xhr.open('GET', url, false);
xhr.send();
var json = JSON.parse(xhr.responseText);
    return json.free_apikey;
}

function getBotMessage(pesan) {
var botName = 'Kuhong Bot ' + unescape('%3Ca%20style=%22color:green%22%3E') + '(✓): ' + unescape('%3C/a%3E');
var taggedName = botName;
if (publicChat == true) taggedName = isTag(getRandomName());
if (taggedName.endsWith('(✓): ')) taggedName = taggedName.split('(')[0] + unescape('%3Ca%20style=%22color:green%22%3E') + '(✓): ' + unescape('%3C/a%3E');
var xhr = new XMLHttpRequest();
var url = 'https://kuhong-api.herokuapp.com/api/simsimi?kata=' + pesan + '&apikey=' + getApikey();
xhr.open('GET', url, false);
xhr.send();
var json = JSON.parse(xhr.responseText);
var pesan = json.result.replace(/simi/g, '').replace(/simsimi/g, '').replace(/bot/g, 'orang');
var send = newLine + getDate() + taggedName + pesan;
document.getElementById("chat").innerHTML += send;
}

function setPublic(turn) {
var delaySend = Math.floor(Math.random() * 19999);
if (turn == false) {
	alert('Mode chat berhasil diubah menjadi Private!');
	publicChat = false;
	}
if (turn == true) {
	alert('Mode chat berhasil diubah menjadi Public!');
	publicChat = true;
    setTimeout('autoSendMessage();', delaySend);
    }
}

function autoSendMessage() {
if (publicChat == false) throw false;
var delaySend = Math.floor(Math.random() * 19999);
var ranName = getRandomName();
var ranMsg = getRandomMessage(nama);
var taggedName = isTag(ranName);
if (ranName.endsWith('(✓): ')) taggedName = ranName.split('(')[0] + unescape('%3Ca%20style=%22color:green%22%3E') + '(✓): ' + unescape('%3C/a%3E');
var sendPublic = newLine + getDate() + taggedName + ranMsg;
document.getElementById("no-message").innerHTML = '';
document.getElementById("chat").innerHTML += sendPublic;
setTimeout('autoSendMessage();', delaySend);
}

function clearChat() {
var clear = confirm('Anda yakin ingin membersihkan chat?');
if (clear) {
    document.getElementById("chat").innerHTML = newLine + getDate() + tilt('Chat telah dibersihkan');
    alert('Chat berhasil dibersihkan!');
    } else throw false; 
}

function isTag(listName) {
   return unescape('%3Ca%20onclick=%22tagPeople(`') + listName + unescape('`)%22%3E') + listName + unescape('%3C/a%3E');
}

function tagPeople(name) {
   document.getElementById("message").value += '*@' + name.split(':')[0] + '*';
}

function pickRandom(list) {
   return list[Math.floor(Math.random() * list.length)];
}
</script>
</body>
</html>
